<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Studio Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الشريط الجانبي -->
    <aside class="sidebar">
        <div class="logo">
            <span class="icon">🎬</span>
            <h2>AI Studio</h2>
        </div>
        <nav>
            <a href="#" class="active">لوحة التحكم</a>
            <a href="#">المشاريع</a>
            <a href="#">القوالب</a>
            <a href="#">الإعدادات</a>
        </nav>
        <div class="user-profile">
            <div class="avatar">A</div>
            <span>المستخدم</span>
        </div>
    </aside>

    <!-- المحتوى الرئيسي -->
    <main class="main-content">
        <header>
            <h1>استوديو الفيديو بالذكاء الاصطناعي</h1>
            <p>حوّل أفكارك إلى فيديوهات احترافية في ثوانٍ.</p>
        </header>

        <div class="workspace">
            <!-- قسم إدخال القصة -->
            <section class="panel input-panel">
                <h3>1. اكتب القصة أو السيناريو</h3>
                <textarea id="storyInput" placeholder="مثال: في مدينة مستقبلية، يطير روبوت صغير فوق المباني..."></textarea>
                <button id="generateBtn" class="primary-btn">توليد المشاهد ✨</button>
            </section>

            <!-- قسم معاينة الفيديو -->
            <section class="panel preview-panel">
                <h3>2. معاينة الفيديو</h3>
                <div class="canvas-container">
                    <canvas id="videoCanvas" width="1280" height="720"></canvas>
                </div>
                <div class="controls">
                    <button id="playBtn">▶ تشغيل</button>
                    <button id="exportBtn" disabled>⬇ تصدير</button>
                </div>
            </section>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
