<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Cartoon Studio Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="studio">

        <header>
            <h1>🎬 Cartoon Studio Pro</h1>
            <p class="subtitle">
                استوديو إنتاج أفلام كرتونية — نسخة GitHub
            </p>
        </header>

        <div class="editor">

            <div class="script-panel">
                <label for="promptInput">📝 السيناريو (اكتب قصتك):</label>

                <textarea
                    id="promptInput"
                    rows="8"
                    placeholder="The lion wakes up in the forest at sunrise.
The monkey meets the elephant.
The animals start a new adventure."
                ></textarea>

                <div class="script-tools">
                    <button id="generateBtn">🔍 تحليل القصة</button>
                    <span id="analysisResult" class="analysis-result"></span>
                </div>
            </div>

            <div class="controls-panel">

                <div class="control-group">
                    <label for="durationInput">⏱️ مدة كل مشهد:</label>
                    <input
                        type="range"
                        id="durationInput"
                        min="1"
                        max="10"
                        value="4"
                        step="1"
                    >
                    <span id="durationValue">4s</span>
                </div>

                <div class="control-group">
                    <label for="volumeSlider">🎵 مستوى الصوت:</label>
                    <input
                        type="range"
                        id="volumeSlider"
                        min="0"
                        max="100"
                        value="40"
                    >
                </div>

                <div class="control-group">
                    <label for="qualitySelect">🎥 جودة التسجيل:</label>
                    <select id="qualitySelect">
                        <option value="fast">سريع (360p)</option>
                        <option value="medium" selected>متوسط (720p)</option>
                        <option value="high">عالي (1080p)</option>
                    </select>
                </div>

            </div>
        </div>

        <div class="preview-section">

            <h3>🎞️ المشاهد</h3>
            <div class="timeline" id="imagesPreview"></div>

            <div class="canvas-wrapper">
                <canvas
                    id="outputCanvas"
                    width="1280"
                    height="720"
                ></canvas>

                <div id="playbackOverlay" class="playback-overlay">
                    <button id="previewBtn" type="button">
                        ▶️ معاينة المشهد
                    </button>
                </div>
            </div>

            <div class="action-bar">
                <button
                    id="createVideoBtn"
                    class="primary-btn"
                    disabled
                >
                    🎬 إنتاج الفيلم الكامل
                </button>

                <button
                    id="stopBtn"
                    class="danger-btn"
                    style="display:none;"
                    type="button"
                >
                    ⏹️ إيقاف
                </button>

                <a
                    id="downloadLink"
                    class="download-btn"
                    style="display:none;"
                >
                    ⬇️ تحميل الفيلم
                </a>
            </div>

            <div id="status" class="status-bar">
                جاهز للبدء...
            </div>

        </div>
    </div>

    <script src="characters.js"></script>
    <script src="engine.js"></script>

    <script>
        const duration = document.getElementById("durationInput");
        const durationValue = document.getElementById("durationValue");

        duration.addEventListener("input", function () {
            durationValue.textContent = this.value + "s";
        });
    </script>

</body>
</html>
