<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Studio Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* ================= CSS ================= */
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #151b2b;
            --border-color: #2a3449;
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --gold: #fbbf24;
            --timeline-bg: #1e2638;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

        body {
            display: flex;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, transparent 60%);
        }

        /* الشريط الجانبي */
        .sidebar {
            width: 260px;
            background: rgba(21, 27, 43, 0.8);
            border-left: 1px solid var(--border-color);
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: fixed;
            right: 0;
            top: 0;
        }

        .logo { display: flex; align-items: center; gap: 10px; font-size: 1.4rem; margin-bottom: 3rem; color: var(--primary); font-weight: 800; }
        
        .sidebar nav a {
            display: block; color: var(--text-muted); text-decoration: none;
            padding: 12px 15px; border-radius: 8px; margin-bottom: 5px; transition: 0.3s; font-weight: 600;
        }

        .sidebar nav a:hover, .sidebar nav a.active { background: rgba(139, 92, 246, 0.15); color: var(--text-main); }

        .user-profile { margin-top: auto; display: flex; align-items: center; gap: 10px; padding-top: 20px; border-top: 1px solid var(--border-color); }
        .avatar { width: 40px; height: 40px; background: var(--primary); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; }

        /* المحتوى الرئيسي */
        .main-content { margin-right: 260px; flex: 1; padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem;}

        header h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        header p { color: var(--text-muted); font-size: 1rem; }

        /* مساحة العمل */
        .workspace { display: grid; grid-template-columns: 1fr 1.2fr; gap: 1.5rem; }

        .panel {
            background: var(--panel-bg); border: 1px solid var(--border-color);
            border-radius: 16px; padding: 1.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .panel h3 { margin-bottom: 1rem; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
        .step-num { background: var(--primary); color: white; width: 24px; height: 24px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.9rem; }

        textarea {
            width: 100%; height: 150px; background: #0b0f19;
            border: 1px solid var(--border-color); border-radius: 12px;
            padding: 1rem; color: var(--text-main); font-size: 1rem; resize: none; outline: none; transition: 0.3s; line-height: 1.6;
        }
        textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2); }

        .primary-btn {
            width: 100%; padding: 1rem; background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 1rem; transition: 0.3s; display: flex; justify-content: center; gap: 10px;
        }
        .primary-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3); }

        /* المعاينة */
        .canvas-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 1rem; border: 1px solid var(--border-color); position: relative; }
        canvas { width: 100%; height: 100%; display: block; }
        
        .controls { display: flex; gap: 1rem; }
        .controls button { flex: 1; padding: 10px; background: #1e2638; border: 1px solid var(--border-color); color: white; border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .controls button:hover:not(:disabled) { background: #2a3449; }
        .controls button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* التايم لاين (Timeline) */
        .timeline-container {
            background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 1rem; overflow-x: auto; white-space: nowrap; display: flex; gap: 10px; align-items: center; min-height: 120px;
        }
        .timeline-item {
            background: #2a3449; border: 2px solid transparent; border-radius: 8px; padding: 10px; min-width: 150px; display: inline-block; cursor: pointer; transition: 0.3s; vertical-align: top; white-space: normal;
        }
        .timeline-item:hover { background: #3b4a66; }
        .timeline-item.active { border-color: var(--primary); background: rgba(139, 92, 246, 0.2); }
        .timeline-item h4 { font-size: 0.8rem; color: var(--gold); margin-bottom: 5px; }
        .timeline-item p { font-size: 0.75rem; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 8px;}
        .timeline-item .duration-input { width: 100%; background: #0b0f19; border: 1px solid #444; color: white; padding: 4px; border-radius: 4px; font-size: 0.8rem;}

        @media (max-width: 1000px) {
            .workspace { grid-template-columns: 1fr; }
            .sidebar { display: none; }
            .main-content { margin-right: 0; padding: 1rem; }
        }
    </style>
</head>
<body>

    <!-- الشريط الجانبي -->
    <aside class="sidebar">
        <div class="logo"><span>🎬</span> AI Studio Pro</div>
        <nav>
            <a href="#" class="active">استوديو الفيديو</a>
            <a href="#">المشاريع</a>
            <a href="#">القوالب</a>
            <a href="#">الإعدادات</a>
        </nav>
        <div class="user-profile">
            <div class="avatar">A</div>
            <span>المستخدم</span>
        </div>
    </aside>

    <!-- المحتوى الرئيسي -->
    <main class="main-content">
        <header>
            <h1>استوديو الفيديو بالذكاء الاصطناعي</h1>
            <p>حوّل أفكارك إلى سيناريوهات ومشاهد احترافية مع شخصيات كرتونية.</p>
        </header>

        <div class="workspace">
            <!-- قسم إدخال القصة -->
            <section class="panel input-panel">
                <h3><span class="step-num">1</span> اكتب القصة</h3>
                <textarea id="storyInput" placeholder="مثال: في غابة سحرية، يستيقظ أسد صغير. يلتقي بأرنب يبحث عن منزله. يقرران عبور النهر."></textarea>
                <button id="generateBtn" class="primary-btn">توليد المشاهد والشخصيات ✨</button>
            </section>

            <!-- قسم معاينة الفيديو -->
            <section class="panel preview-panel">
                <h3><span class="step-num">2</span> معاينة المشهد</h3>
                <div class="canvas-container">
                    <canvas id="videoCanvas" width="960" height="540"></canvas>
                </div>
                <div class="controls">
                    <button id="playBtn" disabled>▶ تشغيل الكل</button>
                    <button id="exportBtn" disabled>⬇ تصدير الفيديو</button>
                </div>
            </section>
        </div>

        <!-- التايم لاين (Timeline) -->
        <section class="panel">
            <h3><span class="step-num">3</span> الخط الزمني (Timeline)</h3>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 10px;">اضغط على أي مشهد لمعاينته، ويمكنك تعديل مدته بالثواني.</p>
            <div class="timeline-container" id="timelineContainer">
                <!-- سيتم توليد المشاهد هنا -->
            </div>
        </section>
    </main>

    <!-- ================= JavaScript ================= -->
    <script>
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        const storyInput = document.getElementById('storyInput');
        const generateBtn = document.getElementById('generateBtn');
        const timelineContainer = document.getElementById('timelineContainer');
        const playBtn = document.getElementById('playBtn');
        const exportBtn = document.getElementById('exportBtn');

        let scenes = [];
        let currentSceneIndex = 0;
        let isPlaying = false;

        // دالة تقسيم القصة وتحليل الشخصيات
        function generateScenes() {
            const text = storyInput.value.trim();
            if (!text) { alert("المرجو كتابة قصة أولاً!"); return; }

            const sentences = text.split(/(?<=[.!?])\s+/).filter(s => s.length > 3);
            
            scenes = sentences.map((sentence, index) => {
                return {
                    id: index + 1,
                    text: sentence,
                    theme: getTheme(sentence),
                    characters: getCharacters(sentence), // استخراج الشخصيات
                    duration: 3 // المدة الافتراضية 3 ثواني
                };
            });

            renderTimeline();
            if (scenes.length > 0) {
                currentSceneIndex = 0;
                drawScene(scenes[0]);
                playBtn.disabled = false;
            }
        }

        // تحديد الثيم (الخلفية)
        function getTheme(text) {
            text = text.toLowerCase();
            if (text.includes('غابة') || text.includes('شجر')) return 'forest';
            if (text.includes('بحر') || text.includes('ماء') || text.includes('نهر')) return 'water';
            if (text.includes('ليل') || text.includes('نجوم')) return 'night';
            if (text.includes('صحراء') || text.includes('رمل')) return 'desert';
            return 'default';
        }

        // استخراج الشخصيات من النص
        function getCharacters(text) {
            const chars = [];
            text = text.toLowerCase();
            if (text.includes('أسد') || text.includes('lion')) chars.push('lion');
            if (text.includes('أرنب') || text.includes('rabbit')) chars.push('rabbit');
            if (text.includes('فيل') || text.includes('elephant')) chars.push('elephant');
            if (text.includes('قطة') || text.includes('cat')) chars.push('cat');
            if (text.includes('روبوت') || text.includes('robot')) chars.push('robot');
            return chars;
        }

        // عرض التايم لاين
        function renderTimeline() {
            timelineContainer.innerHTML = '';
            scenes.forEach((scene, index) => {
                const item = document.createElement('div');
                item.className = `timeline-item ${index === currentSceneIndex ? 'active' : ''}`;
                item.innerHTML = `
                    <h4>مشهد ${scene.id}</h4>
                    <p>${scene.text}</p>
                    <label style="font-size:0.7rem; color:#aaa;">المدة (ثواني):</label>
                    <input type="number" class="duration-input" value="${scene.duration}" min="1" max="10" onchange="updateDuration(${index}, this.value)">
                `;
                item.onclick = (e) => {
                    if(e.target.tagName !== 'INPUT') {
                        currentSceneIndex = index;
                        renderTimeline();
                        drawScene(scene);
                    }
                };
                timelineContainer.appendChild(item);
            });
        }

        // تحديث مدة المشهد
        window.updateDuration = function(index, val) {
            scenes[index].duration = parseInt(val) || 1;
        }

        // رسم المشهد والشخصيات
        function drawScene(scene) {
            // 1. رسم الخلفية
            let skyColor = '#1e1b4b'; let groundColor = '#374151';
            if (scene.theme === 'forest') { skyColor = '#064e3b'; groundColor = '#065f46'; }
            if (scene.theme === 'water') { skyColor = '#0c4a6e'; groundColor = '#0369a1'; }
            if (scene.theme === 'night') { skyColor = '#1e1b4b'; groundColor = '#111827'; }
            if (scene.theme === 'desert') { skyColor = '#7c2d12'; groundColor = '#9a3412'; }

            ctx.fillStyle = skyColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height * 0.7);
            ctx.fillStyle = groundColor;
            ctx.fillRect(0, canvas.height * 0.7, canvas.width, canvas.height * 0.3);

            // الشمس / القمر
            ctx.beginPath();
            ctx.arc(canvas.width * 0.8, canvas.height * 0.2, 40, 0, Math.PI * 2);
            ctx.fillStyle = scene.theme === 'night' ? '#e2e8f0' : '#fbbf24';
            ctx.fill();

            // 2. رسم الشخصيات (Sprites)
            let xOffset = canvas.width / 3; // البداية من الثلث
            scene.characters.forEach(char => {
                drawCharacter(char, xOffset, canvas.height * 0.7);
                xOffset += 150; // مسافة بين الشخصيات
            });

            // 3. كتابة النص
            ctx.fillStyle = 'white';
            ctx.font = 'bold 22px Cairo';
            ctx.textAlign = 'center';
            ctx.shadowColor = 'black';
            ctx.shadowBlur = 10;
            // تقسيم النص إذا كان طويلاً
            const maxWidth = canvas.width - 100;
            const words = scene.text.split(' ');
            let line = '';
            let y = canvas.height - 80;
            
            // رسم خلفية سوداء شفافة للنص
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(0, canvas.height - 100, canvas.width, 100);
            
            ctx.fillStyle = 'white';
            ctx.shadowColor = 'black';
            ctx.shadowBlur = 5;
            ctx.fillText(scene.text, canvas.width / 2, canvas.height - 40);
            ctx.shadowBlur = 0;
        }

        // دالة رسم الشخصيات الكرتونية
        function drawCharacter(type, x, groundY) {
            const size = 50; // حجم الشخصية
            ctx.save();
            ctx.translate(x, groundY);

            if (type === 'lion') {
                // جسم الأسد (دائرة كبيرة)
                ctx.fillStyle = '#f59e0b'; // برتقالي/أصفر
                ctx.beginPath(); ctx.arc(0, -size, size, 0, Math.PI * 2); ctx.fill();
                // رأس الأسد (لبدة)
                ctx.fillStyle = '#d97706'; // برتقالي غامق
                ctx.beginPath(); ctx.arc(0, -size*1.5, size*0.7, 0, Math.PI * 2); ctx.fill();
                // وجه
                ctx.fillStyle = '#fcd34d';
                ctx.beginPath(); ctx.arc(0, -size*1.5, size*0.5, 0, Math.PI * 2); ctx.fill();
            } 
            else if (type === 'rabbit') {
                // جسم الأرنب
                ctx.fillStyle = '#f3f4f6'; // أبيض
                ctx.beginPath(); ctx.ellipse(0, -size*0.8, size*0.7, size, 0, 0, Math.PI * 2); ctx.fill();
                // أذنان
                ctx.beginPath(); ctx.ellipse(-10, -size*1.8, 10, 30, 0, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(10, -size*1.8, 10, 30, 0, 0, Math.PI * 2); ctx.fill();
                // عين
                ctx.fillStyle = '#111';
                ctx.beginPath(); ctx.arc(-10, -size*1.2, 3, 0, Math.PI * 2); ctx.fill();
            }
            else if (type === 'elephant') {
                // جسم الفيل
                ctx.fillStyle = '#94a3b8'; // رمادي
                ctx.beginPath(); ctx.ellipse(0, -size*1.2, size*1.2, size*1.5, 0, 0, Math.PI * 2); ctx.fill();
                // خرطوم
                ctx.fillStyle = '#64748b';
                ctx.beginPath(); ctx.moveTo(0, -size*1.5); ctx.quadraticCurveTo(40, -size, 30, 0); ctx.lineWidth = 15; ctx.strokeStyle = '#64748b'; ctx.stroke();
            }
            else if (type === 'robot') {
                // جسم الروبوت (مربع)
                ctx.fillStyle = '#3b82f6'; // أزرق
                ctx.fillRect(-size, -size*2, size*2, size*2);
                // رأس
                ctx.fillStyle = '#1d4ed8';
                ctx.fillRect(-size*0.6, -size*2.8, size*1.2, size*0.8);
                // عيون
                ctx.fillStyle = '#ef4444'; // أحمر
                ctx.beginPath(); ctx.arc(-15, -size*2.4, 5, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(15, -size*2.4, 5, 0, Math.PI * 2); ctx.fill();
            }

            ctx.restore();
        }

        // ربط الأزرار
        generateBtn.addEventListener('click', generateScenes);

        // تشغيل التايم لاين
        playBtn.addEventListener('click', async () => {
            if (scenes.length === 0 || isPlaying) return;
            isPlaying = true;
            playBtn.disabled = true;
            playBtn.textContent = "جاري التشغيل...";

            for (let i = 0; i < scenes.length; i++) {
                if (!isPlaying) break; // إيقاف
                currentSceneIndex = i;
                renderTimeline();
                drawScene(scenes[i]);
                // الانتظار حسب مدة المشهد
                await new Promise(resolve => setTimeout(resolve, scenes[i].duration * 1000));
            }

            isPlaying = false;
            playBtn.disabled = false;
            playBtn.textContent = "▶ تشغيل الكل";
        });

        // رسم واجهة فارغة في البداية
        ctx.fillStyle = '#0b0f19';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#475569';
        ctx.font = '24px Cairo';
        ctx.textAlign = 'center';
        ctx.fillText("اكتب قصة واضغط 'توليد' لرؤية الشخصيات...", canvas.width / 2, canvas.height / 2);
    </script>
</body>
</html>
